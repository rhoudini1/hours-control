services:
  db:
    image: postgres:17-alpine
    container_name: hours_postgres
    restart: always
    environment:
      POSTGRES_USER: pdadmin
      POSTGRES_PASSWORD: SecureP4ss!
      POSTGRES_DB: hours
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: hours_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hours_backend
    ports:
      - "7282:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=hours;Username=pdadmin;Password=SecureP4ss!
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db

  frontend:
    build:
      context: ./HoursPlatform
      dockerfile: Dockerfile
    container_name: hours_platform
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
